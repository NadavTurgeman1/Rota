return`<div class="card"><h2>Business</h2><div class="g">${n('Name','name')}${n('Type','type')}${n('Minimum rest between shifts (h)','minRest','number')}${n('Max weekly hours','maxHours','number')}${n('Max shift length when covering a gap (h)','maxShift','number')}</div>
<p class="mu">Rest and hour limits depend on your jurisdiction — set them to match local law and your policies.</p></div>
<div class="card sc"><h2>Shifts & staffing</h2><table><tr><th></th><th>Shift</th><th>Start</th><th>End</th><th>Required role</th>${D.map(d=>`<th>${d}</th>`).join('')}</tr>${b.shifts.map((s,i)=>`<tr><td><button class="b s" onclick="delShift(${i})">Delete</button></td><td><input value="${esc(s.name)}" onchange="S.biz.shifts[${i}].name=this.value;save();render()"></td><td><input type=time value="${s.start}" onchange="S.biz.shifts[${i}].start=this.value;save();render()"></td><td><input type=time value="${s.end}" onchange="S.biz.shifts[${i}].end=this.value;save();render()"></td><td><input value="${esc(s.role)}" placeholder="any" onchange="S.biz.shifts[${i}].role=this.value;save()"></td>${D.map((_,d)=>`<td style="min-width:54px"><input type=number min=0 value="${s.req[d]||0}" onchange="S.biz.shifts[${i}].req[${d}]=+this.value;save()"></td>`).join('')}</tr>`).join('')}</table>
<p class="mu">Numbers are employees required per day (0 = closed). A shift ending at or before its start crosses midnight.</p><div class="bar"><button class="b s" onclick="addShift()">+ Add shift</button><button class="b s" onclick="if(!window._c){window._c=1;this.textContent='${tr('Click again to reset to demo data')}'}else{S=demo();fixup();save();window._c=0;render()}">Reset demo data</button></div></div>`}
function delShift(i){if(S.biz.shifts.length<2)return;const id=S.biz.shifts[i].id;S.biz.shifts.splice(i,1);S.emps.forEach(e=>{e.grid=e.grid.map(l=>l.filter(x=>x!=id));e.pref=e.pref.filter(x=>x!=id)});Object.values(S.sched).forEach(sc=>{Object.keys(sc.assign).forEach(k=>{if(k.split('|')[1]==id)delete sc.assign[k]})});save();render()}
function addShift(){const id='s'+Date.now();S.emps.forEach(e=>e.grid.forEach(l=>l.push(id)));S.biz.shifts.push({id,name:tr('New shift'),start:'09:00',end:'17:00',role:'',req:[1,1,1,1,1,1,1]});save();render()}
/* ---------- engine tests ---------- */
function tests(){NOSAVE=true;const bak=S,r=[],t=(n,f)=>{try{r.push([n,!!f()])}catch(e){r.push([n+' ('+e.message+')',false])}};
const w='2026-10-04',sh=[{id:'m',name:'Morning',start:'06:00',end:'14:00',role:'',req:[2,2,2,2,2,2,2]},{id:'a',name:'Afternoon',start:'14:00',end:'22:00',role:'',req:[2,2,2,2,2,2,2]},{id:'n',name:'Night',start:'22:00',end:'06:00',role:'',req:[1,1,1,1,1,1,1]}];
const E=(id,pw,al)=>({id,name:id,contact:'',role:'Guard',quals:'',perWeek:pw,maxHours:0,allowed:al,blocked:[],pref:[],active:true});
const mk=(emps,avail={},shifts=sh,minRest=11)=>({week:w,biz:{name:'t',type:'t',minRest,maxHours:48,assume:true,shifts:JSON.parse(JSON.stringify(shifts))},emps,avail:{[w]:avail},sched:{},closed:{}});
t('Overnight shift lasts 8h and ends next day',()=>{S=mk([]);const s=slots(w).find(x=>x.key=='0|n');return s.e-s.s==8&&s.e==30});
t('Unavailable days are never assigned (Sun/Mon only, 4 contracted)',()=>{S=mk([E('x',4,['m','a']),E('y',5,['m','a','n'])],{x:[['m','a'],['m','a'],[],[],[],[],[]]});gen(w);const sc=S.sched[w];return Object.entries(sc.assign).every(([k,ids])=>!ids.includes('x')||+k[0]<2)&&analyze(w).viol.length==0});
t('Under-contract employee is explained',()=>{S=mk([E('x',4,['m','a'])],{x:[['m'],[],[],[],[],[],[]]});gen(w);return analyze(w).under.length==1&&analyze(w).un.length>0});
t('Insufficient staff is reported as unfilled, never faked',()=>{S=mk([E('x',5,['m'])]);gen(w);const a=analyze(w);return a.un.length>0&&a.viol.length==0&&(S.sched[w].assign['0|m']||[]).length==1});
t('Minimum rest blocks night → next morning',()=>{S=mk([E('x',7,['m','n'])]);const l=slots(w),n=l.find(s=>s.key=='0|n'),m=l.find(s=>s.key=='1|m');return !!dreason(S.emps[0],m,[n])});
t('Required qualification is enforced',()=>{const s2=JSON.parse(JSON.stringify(sh));s2[0].role='Armed';S=mk([E('x',5,['m','a','n'])],{},s2);gen(w);return !Object.entries(S.sched[w].assign).some(([k,v])=>k.endsWith('|m')&&v.length)});
t('No overlapping shifts per employee',()=>{S=mk([E('x',7,['m','a','n']),E('y',7,['m','a','n']),E('z',7,['m','a','n'])]);gen(w);return analyze(w).viol.length==0});
t('Missing afternoon seat: morning and night extend to 12h (same day)',()=>{const s3=JSON.parse(JSON.stringify(sh));s3.forEach(x=>x.req=[2,0,0,0,0,0,0]);S=mk(['p','q','r','u','v'].map(i=>E(i,3,['m','a','n'])),{},s3);const sc=SC(w);sc.assign={'0|m':['p','q'],'0|a':['r'],'0|n':['u','v']};const o=suggest(w,slots(w).find(x=>x.key=='0|a'));if(!o.length||o[0].ext.length!=2||!o[0].ext.every(p=>p.e-p.s==12))return false;applyOpt(sc,o[0]);const a=analyze(w);return a.un.length==0&&a.viol.length==0});
t('Missing night seat is solved by rearranging the same day',()=>{const s3=JSON.parse(JSON.stringify(sh));s3.forEach(x=>x.req=[2,0,0,0,0,0,0]);S=mk(['p','q','r','u','v'].map(i=>E(i,3,['m','a','n'])),{},s3);const sc=SC(w);sc.assign={'0|m':['p','q'],'0|a':['r','u'],'0|n':['v']};const o=suggest(w,slots(w).find(x=>x.key=='0|n'));if(!o.length)return false;applyOpt(sc,o[0]);const a=analyze(w);return a.un.length==0&&a.viol.length==0});
t('Extra shift (6 instead of 5) closes a gap only after approval',()=>{const s3=[JSON.parse(JSON.stringify(sh[0]))];s3[0].req=[1,0,1,0,0,0,0];S=mk([E('p',1,['m'])],{},s3);const sc=SC(w);sc.assign={'0|m':['p']};const sl=slots(w).find(x=>x.key=='2|m');const before=analyze(w);const o=suggestExtra(w,sl);if(before.un.length!=1||o.length!=1||o[0].n!=2)return false;applyExtra(sc,o[0]);const a=analyze(w);return a.un.length==0&&a.viol.length==0});
t('Rest is also enforced across the week boundary (Saturday night → Sunday morning)',()=>{S=mk([E('p',5,['m','a','n'])]);S.sched[addD(w,-7)]={assign:{'6|n':['p']},locked:[],status:'published'};gen(w);const as=S.sched[w].assign;if((as['0|m']||[]).includes('p'))return false;const l=slots(w);const r1=dreason(S.emps[0],l.find(x=>x.key=='0|m'),[]);S.sched[addD(w,-7)].assign={};const r2=dreason(S.emps[0],l.find(x=>x.key=='0|m'),[]);return !!r1&&!r2});
S=bak;NOSAVE=false;return r}
function vTests(){const r=tests();return`<div class="card"><h2>Scheduling engine tests</h2>${r.map(([n,p])=>`<div class="is ${p?'g2':''}">${tr(p?'PASS':'FAIL')} — ${esc(tr(n))}</div>`).join('')}</div>`}
function effTheme(){const t=document.documentElement.getAttribute('data-theme');return t||(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}
function updTh(){const b=document.getElementById('th');if(b)b.textContent=effTheme()=='dark'?'☀':'🌙'}
function toggleTheme(){const t=effTheme()=='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',t);try{localStorage.setItem('rota_theme',t)}catch(e){}updTh()}
try{const t=localStorage.getItem('rota_theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}
function boot(m){const a=document.getElementById('app');if(a)a.innerHTML='<div class="card"><h2>Something went wrong</h2><p class="mu">'+esc(m)+'</p><button class="b" onclick="try{localStorage.removeItem(\'rota2\')}catch(e){}location.reload()">Reset saved data and reload</button></div>'}
window.addEventListener('error',e=>boot(e.message||'error'));
try{render()}catch(e){boot(e.message)}
cloudInit();
</script></body></html>
